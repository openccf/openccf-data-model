name: openccf
id_prefixes:
- openccf
description: An open, interoperable data model for exchanging GHG Protocol-aligned
  corporate carbon footprints between systems. Released under CC0-1.0.
title: OpenCCF - Open Corporate Carbon Footprint Data Model
see_also:
- https://openccf.org
id: https://w3id.org/openccf
imports:
- linkml:types
license: CC0-1.0
prefixes:
  openccf:
    prefix_prefix: openccf
    prefix_reference: https://w3id.org/openccf/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
default_curi_maps:
- semweb_context
default_prefix: openccf
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ScopeEnum:
    name: ScopeEnum
    definition_uri: https://w3id.org/openccf/ScopeEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      SCOPE_1:
        text: SCOPE_1
        description: Direct emissions from owned or controlled sources.
      SCOPE_2:
        text: SCOPE_2
        description: Indirect emissions from purchased energy.
      SCOPE_3:
        text: SCOPE_3
        description: All other indirect value-chain emissions.
  EmissionCategoryEnum:
    name: EmissionCategoryEnum
    definition_uri: https://w3id.org/openccf/EmissionCategoryEnum
    description: Source classification. Valid values are scope-dependent; the scope-to-category
      validity constraint is enforced by rules on EmissionsLine.
    from_schema: https://w3id.org/openccf
    permissible_values:
      STATIONARY_COMBUSTION:
        text: STATIONARY_COMBUSTION
        description: 'Scope 1: Stationary combustion.'
      MOBILE_COMBUSTION:
        text: MOBILE_COMBUSTION
        description: 'Scope 1: Mobile combustion.'
      PROCESS_EMISSIONS:
        text: PROCESS_EMISSIONS
        description: 'Scope 1: Process emissions from physical or chemical processes.'
      FUGITIVE:
        text: FUGITIVE
        description: 'Scope 1: Fugitive emissions.'
      ELECTRICITY_MARKET_BASED:
        text: ELECTRICITY_MARKET_BASED
        description: 'Scope 2: Purchased electricity (market-based method).'
      ELECTRICITY_LOCATION_BASED:
        text: ELECTRICITY_LOCATION_BASED
        description: 'Scope 2: Purchased electricity (location-based method).'
      HEAT_STEAM_COOLING:
        text: HEAT_STEAM_COOLING
        description: 'Scope 2: Purchased heat, steam and cooling.'
      S3_01_PURCHASED_GOODS_SERVICES:
        text: S3_01_PURCHASED_GOODS_SERVICES
        description: 'Category 1: Purchased goods and services.'
      S3_02_CAPITAL_GOODS:
        text: S3_02_CAPITAL_GOODS
        description: 'Category 2: Capital goods.'
      S3_03_FUEL_ENERGY_RELATED:
        text: S3_03_FUEL_ENERGY_RELATED
        description: 'Category 3: Fuel- and energy-related activities (not included
          in Scope 1 or Scope 2).'
      S3_04_UPSTREAM_TRANSPORT:
        text: S3_04_UPSTREAM_TRANSPORT
        description: 'Category 4: Upstream transportation and distribution.'
      S3_05_WASTE_IN_OPERATIONS:
        text: S3_05_WASTE_IN_OPERATIONS
        description: 'Category 5: Waste generated in operations.'
      S3_06_BUSINESS_TRAVEL:
        text: S3_06_BUSINESS_TRAVEL
        description: 'Category 6: Business travel.'
      S3_07_EMPLOYEE_COMMUTING:
        text: S3_07_EMPLOYEE_COMMUTING
        description: 'Category 7: Employee commuting.'
      S3_08_UPSTREAM_LEASED_ASSETS:
        text: S3_08_UPSTREAM_LEASED_ASSETS
        description: 'Category 8: Upstream leased assets.'
      S3_09_DOWNSTREAM_TRANSPORT:
        text: S3_09_DOWNSTREAM_TRANSPORT
        description: 'Category 9: Downstream transportation and distribution.'
      S3_10_PROCESSING_SOLD_PRODUCTS:
        text: S3_10_PROCESSING_SOLD_PRODUCTS
        description: 'Category 10: Processing of sold products.'
      S3_11_USE_OF_SOLD_PRODUCTS:
        text: S3_11_USE_OF_SOLD_PRODUCTS
        description: 'Category 11: Use of sold products.'
      S3_12_EOL_SOLD_PRODUCTS:
        text: S3_12_EOL_SOLD_PRODUCTS
        description: 'Category 12: End-of-life treatment of sold products.'
      S3_13_DOWNSTREAM_LEASED_ASSETS:
        text: S3_13_DOWNSTREAM_LEASED_ASSETS
        description: 'Category 13: Downstream leased assets.'
      S3_14_FRANCHISES:
        text: S3_14_FRANCHISES
        description: 'Category 14: Franchises.'
      S3_15_INVESTMENTS:
        text: S3_15_INVESTMENTS
        description: 'Category 15: Investments.'
      NOT_SPECIFIED:
        text: NOT_SPECIFIED
        description: Category not specified or not disclosed by the source.
  LineStatusEnum:
    name: LineStatusEnum
    definition_uri: https://w3id.org/openccf/LineStatusEnum
    description: Completeness of this line. Assurance status is recorded at report
      level.
    from_schema: https://w3id.org/openccf
    permissible_values:
      COMPLETE:
        text: COMPLETE
        description: Fully measured or calculated for the reporting period.
      INCOMPLETE:
        text: INCOMPLETE
        description: Partially measured; known to under-represent the total for this
          line.
      EXCLUDED:
        text: EXCLUDED
        description: Explicitly excluded from the report.
  ReportStatusEnum:
    name: ReportStatusEnum
    definition_uri: https://w3id.org/openccf/ReportStatusEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      INCOMPLETE:
        text: INCOMPLETE
        description: Not for utilisation as a full company report.
      SELF_COMPLETED:
        text: SELF_COMPLETED
      THIRD_PARTY_COMPLETED:
        text: THIRD_PARTY_COMPLETED
      THIRD_PARTY_AUDITED:
        text: THIRD_PARTY_AUDITED
  EmissionOriginEnum:
    name: EmissionOriginEnum
    definition_uri: https://w3id.org/openccf/EmissionOriginEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      FOSSIL:
        text: FOSSIL
      BIOGENIC:
        text: BIOGENIC
      MIXED:
        text: MIXED
        description: Origin cannot be disaggregated in the source data.
      NOT_SPECIFIED:
        text: NOT_SPECIFIED
        description: Underlying data does not distinguish origin.
      NOT_APPLICABLE:
        text: NOT_APPLICABLE
        description: Origin concept not relevant for this gas.
  AccountingTypeEnum:
    name: AccountingTypeEnum
    definition_uri: https://w3id.org/openccf/AccountingTypeEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      EMISSION:
        text: EMISSION
      REMOVAL:
        text: REMOVAL
      GROSS_CO2_FLUX:
        text: GROSS_CO2_FLUX
        description: Additional disclosure.
      REVERSAL:
        text: REVERSAL
      OTHER_LAND_SECTOR_DISCLOSURE:
        text: OTHER_LAND_SECTOR_DISCLOSURE
        description: Reserved for future expansion.
  GwpHorizonEnum:
    name: GwpHorizonEnum
    definition_uri: https://w3id.org/openccf/GwpHorizonEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      GWP20:
        text: GWP20
      GWP100:
        text: GWP100
      GWP500:
        text: GWP500
  IpccBasisEnum:
    name: IpccBasisEnum
    definition_uri: https://w3id.org/openccf/IpccBasisEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      AR4:
        text: AR4
      AR5:
        text: AR5
      AR6:
        text: AR6
      NOT_SPECIFIED:
        text: NOT_SPECIFIED
  GasEnum:
    name: GasEnum
    definition_uri: https://w3id.org/openccf/GasEnum
    from_schema: https://w3id.org/openccf
    permissible_values:
      CO2:
        text: CO2
      CH4:
        text: CH4
      N2O:
        text: N2O
      HFC:
        text: HFC
        description: With subtype to be specified.
      PFC:
        text: PFC
      SF6:
        text: SF6
      NF3:
        text: NF3
      OTHER:
        text: OTHER
        description: Specified separately.
  DataQualityRatingEnum:
    name: DataQualityRatingEnum
    definition_uri: https://w3id.org/openccf/DataQualityRatingEnum
    description: GHG Protocol data quality indicator rating (Poor to Very good).
    from_schema: https://w3id.org/openccf
    permissible_values:
      VERY_GOOD:
        text: VERY_GOOD
      GOOD:
        text: GOOD
      FAIR:
        text: FAIR
      POOR:
        text: POOR
slots:
  emissionsReport__reportID:
    name: emissionsReport__reportID
    description: Unique identifier for this report.
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:reportID
    identifier: true
    alias: reportID
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: string
    required: true
  emissionsReport__companyName:
    name: emissionsReport__companyName
    description: Legal or trading name of the reporting entity.
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:companyName
    alias: companyName
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: string
    required: true
  emissionsReport__primaryRegion:
    name: emissionsReport__primaryRegion
    description: Location of the reporting entity as a UN/LOCODE (minimum country;
      state/region extension supported).
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:primaryRegion
    alias: primaryRegion
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: string
    required: true
  emissionsReport__reportingPeriodStart:
    name: emissionsReport__reportingPeriodStart
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:reportingPeriodStart
    alias: reportingPeriodStart
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: date
    required: true
  emissionsReport__reportingPeriodEnd:
    name: emissionsReport__reportingPeriodEnd
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:reportingPeriodEnd
    alias: reportingPeriodEnd
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: date
    required: true
  emissionsReport__totalNetEmissionsLocationBasedKgCO2e:
    name: emissionsReport__totalNetEmissionsLocationBasedKgCO2e
    description: 'Net aggregate for the reporting period on the location-based Scope
      2 method: sum(EMISSION) - sum(REMOVAL) + sum(REVERSAL) over all emissionsLines,
      excluding GROSS_CO2_FLUX and OTHER_LAND_SECTOR_DISCLOSURE lines, and excluding
      ELECTRICITY_MARKET_BASED lines. Always present: location-based is the baseline
      method, and for reports with no market-based electricity this is simply the
      report total.'
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:totalNetEmissionsLocationBasedKgCO2e
    alias: totalNetEmissionsLocationBasedKgCO2e
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: float
    required: true
  emissionsReport__totalNetEmissionsMarketBasedKgCO2e:
    name: emissionsReport__totalNetEmissionsMarketBasedKgCO2e
    description: 'Net aggregate for the reporting period on the market-based Scope
      2 method: as above, excluding ELECTRICITY_LOCATION_BASED lines. Present only
      where the report contains market-based electricity lines. Omitted (left blank,
      never zero) otherwise.'
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:totalNetEmissionsMarketBasedKgCO2e
    alias: totalNetEmissionsMarketBasedKgCO2e
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: float
  emissionsReport__gwpHorizon:
    name: emissionsReport__gwpHorizon
    description: GWP time horizon applied across the whole report. Report-level to
      enforce consistency; IPCC AR basis is recorded per line.
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:gwpHorizon
    alias: gwpHorizon
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: GwpHorizonEnum
    required: true
  emissionsReport__reportStatus:
    name: emissionsReport__reportStatus
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:reportStatus
    alias: reportStatus
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: ReportStatusEnum
    required: true
  emissionsReport__emissionsLines:
    name: emissionsReport__emissionsLines
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:emissionsLines
    alias: emissionsLines
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: EmissionsLine
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  emissionsReport__sectors:
    name: emissionsReport__sectors
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:sectors
    alias: sectors
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: Sector
    multivalued: true
    inlined: true
    inlined_as_list: true
  emissionsReport__companyIdentifiers:
    name: emissionsReport__companyIdentifiers
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:companyIdentifiers
    alias: companyIdentifiers
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: CompanyIdentifier
    multivalued: true
    inlined: true
    inlined_as_list: true
  emissionsReport__intensityDenominators:
    name: emissionsReport__intensityDenominators
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:intensityDenominators
    alias: intensityDenominators
    owner: EmissionsReport
    domain_of:
    - EmissionsReport
    range: IntensityDenominator
    multivalued: true
    inlined: true
    inlined_as_list: true
  emissionsLine__scope:
    name: emissionsLine__scope
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:scope
    alias: scope
    owner: EmissionsLine
    domain_of:
    - EmissionsLine
    range: ScopeEnum
    required: true
  emissionsLine__category:
    name: emissionsLine__category
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:category
    alias: category
    owner: EmissionsLine
    domain_of:
    - EmissionsLine
    range: EmissionCategoryEnum
    required: true
  emissionsLine__subcategory:
    name: emissionsLine__subcategory
    description: Optional free-text subcategorisation of the line within its category,
      at the sender's discretion (e.g. "Food and beverages" or "HGV fleet"). There
      is no controlled vocabulary; values are descriptive and not intended to be machine-comparable.
      Useful for breaking a category into meaningful detail  without changing its
      GHG Protocol classification. It is intended as a grouping label  a sender or
      receiver can use to aggregate or subtotal lines (e.g. summing all  "HGV fleet"
      lines). It describes the kind of line, not the specific activity used  to calculate
      it (see ActivityData).
    from_schema: https://w3id.org/openccf
    slot_uri: openccf:subcategory
    alias: subcategory
    owner: EmissionsLine
    domain_of:
    - EmissionsLine
    range: string
  emissionsLine__lineStatus:
    name: emissionsLine__lineStatus

classes:
  EmissionsReport:
    name: EmissionsReport
    definition_uri: https://w3id.org/openccf/EmissionsReport
    description: A company's greenhouse gas footprint for a defined reporting period.
      Acts as the container for one or more Emissions Lines. The location-based net
      total is always present; the market-based total is present only where the report
      contains market-based electricity lines. The derivation of each total from its
      lines is a semantic constraint, verified by the conformance tests rather than
      by schema validation.
    from_schema: https://w3id.org/openccf
    slots:
    - emissionsReport__reportID
    - emissionsReport__companyName
    - emissionsReport__primaryRegion
    - emissionsReport__reportingPeriodStart
    - emissionsReport__reportingPeriodEnd
    - emissionsReport__totalNetEmissionsLocationBasedKgCO2e
    - emissionsReport__totalNetEmissionsMarketBasedKgCO2e
    - emissionsReport__gwpHorizon
    - emissionsReport__reportStatus
    - emissionsReport__emissionsLines
    - emissionsReport__sectors
    - emissionsReport__companyIdentifiers
    - emissionsReport__intensityDenominators
    attributes:
      reportID:
        name: reportID
        description: Unique identifier for this report.
        identifier: true
      companyName:
        name: companyName
        description: Legal or trading name of the reporting entity.
        required: true
      primaryRegion:
        name: primaryRegion
        description: Location of the reporting entity as a UN/LOCODE (minimum country;
          state/region extension supported).
        required: true
      reportingPeriodStart:
        name: reportingPeriodStart
        range: date
        required: true
      reportingPeriodEnd:
        name: reportingPeriodEnd
        range: date
        required: true
      totalNetEmissionsLocationBasedKgCO2e:
        name: totalNetEmissionsLocationBasedKgCO2e
        description: 'Net aggregate for the reporting period on the location-based
          Scope 2 method: sum(EMISSION) - sum(REMOVAL) + sum(REVERSAL) over all emissionsLines,
          excluding GROSS_CO2_FLUX and OTHER_LAND_SECTOR_DISCLOSURE lines, and excluding
          ELECTRICITY_MARKET_BASED lines. Always present: location-based is the baseline
          method, and for reports with no market-based electricity this is simply
          the report total.'
        range: float
        required: true
      totalNetEmissionsMarketBasedKgCO2e:
        name: totalNetEmissionsMarketBasedKgCO2e
        description: 'Net aggregate for the reporting period on the market-based Scope
          2 method: as above, excluding ELECTRICITY_LOCATION_BASED lines. Present
          only where the report contains market-based electricity lines. Omitted (left
          blank, never zero) otherwise.'
        range: float
      gwpHorizon:
        name: gwpHorizon
        description: GWP time horizon applied across the whole report. Report-level
          to enforce consistency; IPCC AR basis is recorded per line.
        range: GwpHorizonEnum
        required: true
      reportStatus:
        name: reportStatus
        range: ReportStatusEnum
        required: true
      emissionsLines:
        name: emissionsLines
        range: EmissionsLine
        required: true
        multivalued: true
        inlined_as_list: true
      sectors:
        name: sectors
        range: Sector
        multivalued: true
        inlined_as_list: true
      companyIdentifiers:
        name: companyIdentifiers
        range: CompanyIdentifier
        multivalued: true
        inlined_as_list: true
      intensityDenominators:
        name: intensityDenominators
        range: IntensityDenominator
        multivalued: true
        inlined_as_list: true
    class_uri: openccf:EmissionsReport
    tree_root: true
  EmissionsLine:
    name: EmissionsLine
    definition_uri: https://w3id.org/openccf/EmissionsLine
    description: A single quantified source or category of emissions within a report.
      Lines are flat; totals and subtotals are derived by grouping, not nesting.
    from_schema: https://w3id.org/openccf
    slots:
    - emissionsLine__scope
    - emissionsLine__category
    - emissionsLine__subcategory
    - emissionsLine__lineStatus
    - emissionsLine__emissionsQuantityKgCO2e
    - emissionsLine__emissionOrigin
    - emissionsLine__accountingType
    - emissionsLine__region
    - emissionsLine__companyFacilityIdentifier
    - emissionsLine__emissionFactor
    - emissionsLine__dataQuality
    - emissionsLine__dataQualityInformation
    - emissionsLine__gasBreakdown
    - emissionsLine__activityData
    - emissionsLine__landSectorData
    attributes:
      scope:
        name: scope
        range: ScopeEnum
        required: true
      category:
        name: category
        range: EmissionCategoryEnum
        required: true
      subcategory:
        name: subcategory
        description: Optional free-text subcategorisation of the line within its category,
          at the sender's discretion (e.g. "Food and beverages" or "HGV fleet"). There
          is no controlled vocabulary; values are descriptive and not intended to
          be machine-comparable. Useful for breaking a category into meaningful detail  without
          changing its GHG Protocol classification. It is intended as a grouping label  a
          sender or receiver can use to aggregate or subtotal lines (e.g. summing
          all  "HGV fleet" lines). It describes the kind of line, not the specific
          activity used  to calculate it (see ActivityData).
      lineStatus:
        name: lineStatus
        range: LineStatusEnum
        required: true
      emissionsQuantityKgCO2e:
        name: emissionsQuantityKgCO2e
        description: Total CO2-equivalent for this line, expressed as a non-negative
          magnitude. Direction (whether the line adds to or subtracts from the net)
          is determined by accountingType, not by the sign of this value - consistent
          with GHG Protocol gross reporting, under which gross emissions and gross
          removals are reported separately and not netted within a category.
        range: float
        required: true
        minimum_value: 0
      emissionOrigin:
        name: emissionOrigin
        range: EmissionOriginEnum
        required: true
      accountingType:
        name: accountingType
        description: 'Inventory treatment of this line, and its contribution to the
          report net total: EMISSION adds, REMOVAL subtracts, REVERSAL adds; GROSS_CO2_FLUX
          and OTHER_LAND_SECTOR_DISCLOSURE are disclosure-only and excluded from the
          net. Defaults to EMISSION where omitted.'
        ifabsent: EMISSION
        range: AccountingTypeEnum
      region:
        name: region
        description: Country or region where emissions physically occurred, as a UN/LOCODE
          (minimum country; state/region extension supported).
        required: true
      companyFacilityIdentifier:
        name: companyFacilityIdentifier
        description: Facility where emissions physically occurred (optional).
      emissionFactor:
        name: emissionFactor
        description: Metadata on the emission factor used for this line. Optional
          as many exchanged figures (e.g. republished totals, or directly measured
          emissions) have no disclosed factor. Where factor is provided, source, year
          and ipccBasis are required.
        range: EmissionFactor
        inlined: true
      dataQuality:
        name: dataQuality
        description: GHG Protocol data quality assessment for this line, spanning
          both the activity data and the emission factor used. Optional; most relevant
          where secondary, proxy or estimated inputs are applied. Use dataQualityInformation
          for any additional context.
        range: DataQuality
        inlined: true
      dataQualityInformation:
        name: dataQualityInformation
        description: Optional free-text data quality context not captured by the indicators
          above (e.g. calculation method, provenance, known limitations). Sender's
          discretion; not machine-comparable.
      gasBreakdown:
        name: gasBreakdown
        range: GasBreakdown
        multivalued: true
        inlined_as_list: true
      activityData:
        name: activityData
        range: ActivityData
        inlined: true
      landSectorData:
        name: landSectorData
        range: LandSectorData
        inlined: true
    class_uri: openccf:EmissionsLine
    rules:
    - preconditions:
        slot_conditions:
          scope:
            name: scope
            equals_string: SCOPE_1
      postconditions:
        slot_conditions:
          category:
            name: category
            any_of:
            - equals_string: STATIONARY_COMBUSTION
            - equals_string: MOBILE_COMBUSTION
            - equals_string: PROCESS_EMISSIONS
            - equals_string: FUGITIVE
            - equals_string: NOT_SPECIFIED
      description: Scope 1 lines must use a Scope 1 category, or NOT_SPECIFIED.
    - preconditions:
        slot_conditions:
          scope:
            name: scope
            equals_string: SCOPE_2
      postconditions:
        slot_conditions:
          category:
            name: category
            any_of:
            - equals_string: ELECTRICITY_MARKET_BASED
            - equals_string: ELECTRICITY_LOCATION_BASED
            - equals_string: HEAT_STEAM_COOLING
            - equals_string: NOT_SPECIFIED
      description: Scope 2 lines must use a Scope 2 category, or NOT_SPECIFIED.
    - preconditions:
        slot_conditions:
          scope:
            name: scope
            equals_string: SCOPE_3
      postconditions:
        slot_conditions:
          category:
            name: category
            any_of:
            - equals_string: S3_01_PURCHASED_GOODS_SERVICES
            - equals_string: S3_02_CAPITAL_GOODS
            - equals_string: S3_03_FUEL_ENERGY_RELATED
            - equals_string: S3_04_UPSTREAM_TRANSPORT
            - equals_string: S3_05_WASTE_IN_OPERATIONS
            - equals_string: S3_06_BUSINESS_TRAVEL
            - equals_string: S3_07_EMPLOYEE_COMMUTING
            - equals_string: S3_08_UPSTREAM_LEASED_ASSETS
            - equals_string: S3_09_DOWNSTREAM_TRANSPORT
            - equals_string: S3_10_PROCESSING_SOLD_PRODUCTS
            - equals_string: S3_11_USE_OF_SOLD_PRODUCTS
            - equals_string: S3_12_EOL_SOLD_PRODUCTS
            - equals_string: S3_13_DOWNSTREAM_LEASED_ASSETS
            - equals_string: S3_14_FRANCHISES
            - equals_string: S3_15_INVESTMENTS
            - equals_string: NOT_SPECIFIED
      description: Scope 3 lines must use a Scope 3 category, or NOT_SPECIFIED.
  Sector:
    name: Sector
    definition_uri: https://w3id.org/openccf/Sector
    description: Standardised sector classification.
    from_schema: https://w3id.org/openccf
    slots:
    - sector__scheme
    - sector__code
    - sector__name
    attributes:
      scheme:
        name: scheme
        description: Classification scheme (e.g. NACE, SIC, GHG Protocol sector).
      code:
        name: code
      name:
        name: name
    class_uri: openccf:Sector
  CompanyIdentifier:
    name: CompanyIdentifier
    definition_uri: https://w3id.org/openccf/CompanyIdentifier
    description: Standardised company identifier.
    from_schema: https://w3id.org/openccf
    slots:
    - companyIdentifier__scheme
    - companyIdentifier__value
    attributes:
      scheme:
        name: scheme
        description: Identifier scheme (e.g. LEI, DUNS).
      value:
        name: value
    class_uri: openccf:CompanyIdentifier
  IntensityDenominator:
    name: IntensityDenominator
    definition_uri: https://w3id.org/openccf/IntensityDenominator
    description: A denominator for calculating intensity values.
    from_schema: https://w3id.org/openccf
    slots:
    - intensityDenominator__type
    - intensityDenominator__value
    - intensityDenominator__unit
    attributes:
      type:
        name: type
        description: e.g. full-time employees, revenue, facility area.
      value:
        name: value
        range: float
      unit:
        name: unit
    class_uri: openccf:IntensityDenominator
  EmissionFactor:
    name: EmissionFactor
    definition_uri: https://w3id.org/openccf/EmissionFactor
    description: Metadata describing the emission factor applied to a line.
    from_schema: https://w3id.org/openccf
    slots:
    - emissionFactor__value
    - emissionFactor__valueUnit
    - emissionFactor__source
    - emissionFactor__dataset
    - emissionFactor__dataYear
    - emissionFactor__ipccBasis
    attributes:
      value:
        name: value
        description: Value of the emission factor applied, expressed in kgCO2e per
          unit of the activity (see valueUnit). Optional; provided where the sender
          wishes to expose the conversion rate used. Gas-level constituents are not
          carried here - where gas resolution is needed, use the line's gasBreakdown.
        range: float
        minimum_value: 0
      valueUnit:
        name: valueUnit
        description: Denominator unit for the emission factor value, i.e. the activity
          unit it applies to (e.g. "kWh", "litre", "tonne-km", "GBP"). Required where
          value is provided. Where activityData is also present, this should match
          its unit.
      source:
        name: source
        description: Authority for the emission factor used.
        required: true
      dataset:
        name: dataset
        description: Specific dataset used (optional).
      dataYear:
        name: dataYear
        description: Year the emission factor was issued.
        range: integer
        required: true
      ipccBasis:
        name: ipccBasis
        description: IPCC Assessment Report basis for the GWP values used.
        range: IpccBasisEnum
        required: true
    class_uri: openccf:EmissionFactor
  GasBreakdown:
    name: GasBreakdown
    definition_uri: https://w3id.org/openccf/GasBreakdown
    description: 'Constituent gas-level resolution of a line''s emissions. Where a
      breakdown is provided it must be complete: the sum of gasCO2eContribution across
      entries equals the line''s emissionsQuantityKgCO2e, within a small rounding
      tolerance (relative 0.1% with an absolute floor for near-zero lines). Any portion
      not attributable to a named gas is carried as an explicit OTHER entry rather
      than left implicit.'
    from_schema: https://w3id.org/openccf
    slots:
    - gasBreakdown__gas
    - gasBreakdown__gasQuantity
    - gasBreakdown__gasCO2eContribution
    - gasBreakdown__emissionOrigin
    attributes:
      gas:
        name: gas
        range: GasEnum
        required: true
      gasQuantity:
        name: gasQuantity
        description: Quantity of the gas in its native unit (e.g. tonnes CH4).
        range: float
      gasCO2eContribution:
        name: gasCO2eContribution
        description: Portion of the line's emissionsQuantityKgCO2e attributable to
          this gas, as a non-negative magnitude. Where a breakdown is present, contributions
          sum to the line total (see class-level note).
        range: float
        minimum_value: 0
      emissionOrigin:
        name: emissionOrigin
        description: Origin of this gas's emissions. Where a gas breakdown is provided,
          gas-level origin takes precedence over the line-level emissionOrigin.
        range: EmissionOriginEnum
    class_uri: openccf:GasBreakdown
  ActivityData:
    name: ActivityData
    definition_uri: https://w3id.org/openccf/ActivityData
    description: Optional activity information underlying the emissions.
    from_schema: https://w3id.org/openccf
    slots:
    - activityData__description
    - activityData__lifecycleStage
    - activityData__value
    - activityData__unit
    attributes:
      description:
        name: description
        description: Free-text description of the specific activity quantity used
          to calculate this line's emissions (e.g. "diesel purchased for site generator").
          Describes this particular measurement for provenance or recalculation, not
          a grouping label - use subcategory on the line for aggregation.
      lifecycleStage:
        name: lifecycleStage
        description: Where applicable (e.g. upstream, use phase, end-of-life).
      value:
        name: value
        range: float
      unit:
        name: unit
    class_uri: openccf:ActivityData
  DataQuality:
    name: DataQuality
    definition_uri: https://w3id.org/openccf/DataQuality
    description: 'Data quality of an emissions line, aligned to the GHG Protocol Scope
      3 Standard''s five data quality indicators. The assessment reflects both the
      activity data and the emission factor used: the representativeness axes describe
      how well the inputs match this line''s technology, period and geography, while
      completeness and reliability describe the underlying data and its sources. Each
      axis is rated Poor to Very good. (A GHG Protocol revision toward a data-specificity
      framework is in progress; this structure will track it in a future version.)'
    from_schema: https://w3id.org/openccf
    slots:
    - dataQuality__technologicalRepresentativeness
    - dataQuality__temporalRepresentativeness
    - dataQuality__geographicalRepresentativeness
    - dataQuality__completeness
    - dataQuality__reliability
    attributes:
      technologicalRepresentativeness:
        name: technologicalRepresentativeness
        description: Degree to which the emission estimation reflects the actual technology(ies)
          used.
        range: DataQualityRatingEnum
      temporalRepresentativeness:
        name: temporalRepresentativeness
        description: Degree to which the emission estimation reflects the actual time
          period.
        range: DataQualityRatingEnum
      geographicalRepresentativeness:
        name: geographicalRepresentativeness
        description: Degree to which the emission estimation reflects the actual geography.
        range: DataQualityRatingEnum
      completeness:
        name: completeness
        description: Degree to which the emission estimation is statistically representative
          and complete.
        range: DataQualityRatingEnum
      reliability:
        name: reliability
        description: Reliability of the emission estimation sources and measurement
          or estimation methods.
        range: DataQualityRatingEnum
    class_uri: openccf:DataQuality
  LandSectorData:
    name: LandSectorData
    definition_uri: https://w3id.org/openccf/LandSectorData
    description: Optional land sector and removals metadata.
    from_schema: https://w3id.org/openccf
    slots:
    - landSectorData__boundary
    - landSectorData__storageDuration
    - landSectorData__monitoringApproach
    attributes:
      boundary:
        name: boundary
        description: Land boundary / traceability level.
      storageDuration:
        name: storageDuration
        description: Expected storage duration / permanence category.
      monitoringApproach:
        name: monitoringApproach
        description: Monitoring approach and reversal treatment.
    class_uri: openccf:LandSectorData

id: https://w3id.org/openccf
name: openccf
title: OpenCCF - Open Corporate Carbon Footprint Data Model
description: >-
  An open, interoperable data model for exchanging GHG Protocol-aligned
  corporate carbon footprints between systems. Released under CC0-1.0.
license: CC0-1.0
see_also:
  - https://openccf.org

default_prefix: openccf
default_range: string

default_curi_maps:
  - semweb_context
id_prefixes:
  - openccf

prefixes:
  openccf: https://w3id.org/openccf/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types

# ==========================================================================
# CLASSES
# ==========================================================================
classes:

  EmissionsReport:
    tree_root: true
    description: >-
      A company's greenhouse gas footprint for a defined reporting period.
      Acts as the container for one or more Emissions Lines. The location-based net
      total is always present; the market-based total is present only where the report
      contains market-based electricity lines. The derivation of each total from its
      lines is a semantic constraint, verified by the conformance tests rather than by
      schema validation.
    # NOTE: coverage/completeness is inferred from the lines present plus each
    # line's lineStatus. Absence of a line is NOT an assertion of zero.
    attributes:
      reportID:
        identifier: true
        description: Unique identifier for this report.
      companyName:
        required: true
        description: Legal or trading name of the reporting entity.
      primaryRegion:
        required: true
        description: >-
          Location of the reporting entity as a UN/LOCODE
          (minimum country; state/region extension supported).
      reportingPeriodStart:
        range: date
        required: true
      reportingPeriodEnd:
        range: date
        required: true
      totalNetEmissionsLocationBasedKgCO2e:
        range: float
        required: true
        description: >-
          Net aggregate for the reporting period on the location-based Scope 2 method:
          sum(EMISSION) - sum(REMOVAL) + sum(REVERSAL) over all emissionsLines, excluding
          GROSS_CO2_FLUX and OTHER_LAND_SECTOR_DISCLOSURE lines, and excluding
          ELECTRICITY_MARKET_BASED lines. Always present: location-based is the baseline
          method, and for reports with no market-based electricity this is simply the
          report total.
      totalNetEmissionsMarketBasedKgCO2e:
        range: float
        description: >-
          Net aggregate for the reporting period on the market-based Scope 2 method: as
          above, excluding ELECTRICITY_LOCATION_BASED lines. Present only where the report
          contains market-based electricity lines. Omitted (left blank, never zero)
          otherwise.
      gwpHorizon:
        range: GwpHorizonEnum
        required: true
        description: >-
          GWP time horizon applied across the whole report. Report-level to
          enforce consistency; IPCC AR basis is recorded per line.
      reportStatus:
        range: ReportStatusEnum
        required: true
      emissionsLines:
        range: EmissionsLine
        required: true
        multivalued: true
        inlined_as_list: true
      sectors:
        range: Sector
        multivalued: true
        inlined_as_list: true
      companyIdentifiers:
        range: CompanyIdentifier
        multivalued: true
        inlined_as_list: true
      intensityDenominators:
        range: IntensityDenominator
        multivalued: true
        inlined_as_list: true

  EmissionsLine:
    description: >-
      A single quantified source or category of emissions within a report.
      Lines are flat; totals and subtotals are derived by grouping, not nesting.
    rules:
      - preconditions:
          slot_conditions:
            scope:
              equals_string: SCOPE_1
        postconditions:
          slot_conditions:
            category:
              any_of:
                - equals_string: STATIONARY_COMBUSTION
                - equals_string: MOBILE_COMBUSTION
                - equals_string: PROCESS_EMISSIONS
                - equals_string: FUGITIVE
                - equals_string: NOT_SPECIFIED
        description: Scope 1 lines must use a Scope 1 category, or NOT_SPECIFIED.
      - preconditions:
          slot_conditions:
            scope:
              equals_string: SCOPE_2
        postconditions:
          slot_conditions:
            category:
              any_of:
                - equals_string: ELECTRICITY_MARKET_BASED
                - equals_string: ELECTRICITY_LOCATION_BASED
                - equals_string: HEAT_STEAM_COOLING
                - equals_string: NOT_SPECIFIED
        description: Scope 2 lines must use a Scope 2 category, or NOT_SPECIFIED.
      - preconditions:
          slot_conditions:
            scope:
              equals_string: SCOPE_3
        postconditions:
          slot_conditions:
            category:
              any_of:
                - equals_string: S3_01_PURCHASED_GOODS_SERVICES
                - equals_string: S3_02_CAPITAL_GOODS
                - equals_string: S3_03_FUEL_ENERGY_RELATED
                - equals_string: S3_04_UPSTREAM_TRANSPORT
                - equals_string: S3_05_WASTE_IN_OPERATIONS
                - equals_string: S3_06_BUSINESS_TRAVEL
                - equals_string: S3_07_EMPLOYEE_COMMUTING
                - equals_string: S3_08_UPSTREAM_LEASED_ASSETS
                - equals_string: S3_09_DOWNSTREAM_TRANSPORT
                - equals_string: S3_10_PROCESSING_SOLD_PRODUCTS
                - equals_string: S3_11_USE_OF_SOLD_PRODUCTS
                - equals_string: S3_12_EOL_SOLD_PRODUCTS
                - equals_string: S3_13_DOWNSTREAM_LEASED_ASSETS
                - equals_string: S3_14_FRANCHISES
                - equals_string: S3_15_INVESTMENTS
                - equals_string: NOT_SPECIFIED
        description: Scope 3 lines must use a Scope 3 category, or NOT_SPECIFIED.
    attributes:
      scope:
        range: ScopeEnum
        required: true
      category:
        range: EmissionCategoryEnum
        required: true
      subcategory:
        description: >-
          Optional free-text subcategorisation of the line within its category, at the
          sender's discretion (e.g. "Food and beverages" or "HGV fleet"). There is no
          controlled vocabulary; values are descriptive and not intended to be
          machine-comparable. Useful for breaking a category into meaningful detail 
          without changing its GHG Protocol classification. It is intended as a grouping label 
          a sender or receiver can use to aggregate or subtotal lines (e.g. summing all 
          "HGV fleet" lines). It describes the kind of line, not the specific activity used 
          to calculate it (see ActivityData).
      lineStatus:
        range: LineStatusEnum
        required: true
      emissionsQuantityKgCO2e:
        range: float
        required: true
        minimum_value: 0
        description: >-
          Total CO2-equivalent for this line, expressed as a non-negative magnitude.
          Direction (whether the line adds to or subtracts from the net) is determined
          by accountingType, not by the sign of this value - consistent with GHG Protocol
          gross reporting, under which gross emissions and gross removals are reported
          separately and not netted within a category.
      emissionOrigin:
        range: EmissionOriginEnum
        required: true
      accountingType:
        range: AccountingTypeEnum
        ifabsent: "EMISSION"
        description: >-
          Inventory treatment of this line, and its contribution to the report net total:
          EMISSION adds, REMOVAL subtracts, REVERSAL adds; GROSS_CO2_FLUX and
          OTHER_LAND_SECTOR_DISCLOSURE are disclosure-only and excluded from the net.
          Defaults to EMISSION where omitted.
      region:
        required: true
        description: >-
          Country or region where emissions physically occurred, as a UN/LOCODE
          (minimum country; state/region extension supported).
      companyFacilityIdentifier:
        description: Facility where emissions physically occurred (optional).
      emissionFactor:
        range: EmissionFactor
        inlined: true
        description: >-
          Metadata on the emission factor used for this line. Optional as many exchanged
          figures (e.g. republished totals, or directly measured emissions) have no
          disclosed factor. Where factor is provided, source, year and ipccBasis are required.
      dataQuality:
        range: DataQuality
        inlined: true
        description: >-
          GHG Protocol data quality assessment for this line, spanning both the activity data
          and the emission factor used. Optional; most relevant where secondary, proxy or
          estimated inputs are applied. Use dataQualityInformation for any additional context.
      dataQualityInformation:
        description: >-
          Optional free-text data quality context not captured by the indicators above
          (e.g. calculation method, provenance, known limitations). Sender's discretion;
          not machine-comparable.
      gasBreakdown:
        range: GasBreakdown
        multivalued: true
        inlined_as_list: true
      activityData:
        range: ActivityData
        inlined: true
      landSectorData:
        range: LandSectorData
        inlined: true

  # --- satellite classes (straightforward; refine in next pass) ---------------
  Sector:
    description: Standardised sector classification.
    attributes:
      scheme:
        description: Classification scheme (e.g. NACE, SIC, GHG Protocol sector).
      code:
      name:

  CompanyIdentifier:
    description: Standardised company identifier.
    attributes:
      scheme:
        description: Identifier scheme (e.g. LEI, DUNS).
      value:

  IntensityDenominator:
    description: A denominator for calculating intensity values.
    attributes:
      type:
        description: e.g. full-time employees, revenue, facility area.
      value:
        range: float
      unit:

  EmissionFactor:
    description: Metadata describing the emission factor applied to a line.
    attributes:
      value:
        range: float
        minimum_value: 0
        description: >-
          Value of the emission factor applied, expressed in kgCO2e per unit of the
          activity (see valueUnit). Optional; provided where the sender wishes to expose
          the conversion rate used. Gas-level constituents are not carried here - where
          gas resolution is needed, use the line's gasBreakdown.
      valueUnit:
        description: >-
          Denominator unit for the emission factor value, i.e. the activity unit it
          applies to (e.g. "kWh", "litre", "tonne-km", "GBP"). Required where value is
          provided. Where activityData is also present, this should match its unit.
      source:
        required: true
        description: Authority for the emission factor used.
      dataset:
        description: Specific dataset used (optional).
      dataYear:
        range: integer
        required: true
        description: Year the emission factor was issued.
      ipccBasis:
        range: IpccBasisEnum
        required: true
        description: IPCC Assessment Report basis for the GWP values used.

  GasBreakdown:
    description: >-
      Constituent gas-level resolution of a line's emissions. Where a breakdown is
      provided it must be complete: the sum of gasCO2eContribution across entries equals
      the line's emissionsQuantityKgCO2e, within a small rounding tolerance (relative 0.1%
      with an absolute floor for near-zero lines). Any portion not attributable to a named
      gas is carried as an explicit OTHER entry rather than left implicit.
    attributes:
      gas:
        range: GasEnum
        required: true
      gasQuantity:
        range: float
        description: Quantity of the gas in its native unit (e.g. tonnes CH4).
      gasCO2eContribution:
        range: float
        minimum_value: 0
        description: >-
          Portion of the line's emissionsQuantityKgCO2e attributable to this gas, as a
          non-negative magnitude. Where a breakdown is present, contributions sum to the
          line total (see class-level note).
      emissionOrigin:
        range: EmissionOriginEnum
        description: >-
          Origin of this gas's emissions. Where a gas breakdown is provided, gas-level
          origin takes precedence over the line-level emissionOrigin.

  ActivityData:
    description: Optional activity information underlying the emissions.
    attributes:
      description:
        description: >-
          Free-text description of the specific activity quantity used to calculate this
          line's emissions (e.g. "diesel purchased for site generator"). Describes this
          particular measurement for provenance or recalculation, not a grouping label -
          use subcategory on the line for aggregation.
      lifecycleStage:
        description: Where applicable (e.g. upstream, use phase, end-of-life).
      value:
        range: float
      unit:

  DataQuality:
    description: >-
      Data quality of an emissions line, aligned to the GHG Protocol Scope 3 Standard's five
      data quality indicators. The assessment reflects both the activity data and the emission
      factor used: the representativeness axes describe how well the inputs match this line's
      technology, period and geography, while completeness and reliability describe the
      underlying data and its sources. Each axis is rated Poor to Very good. (A GHG Protocol
      revision toward a data-specificity framework is in progress; this structure will track it
      in a future version.)
    attributes:
      technologicalRepresentativeness:
        range: DataQualityRatingEnum
        description: Degree to which the emission estimation reflects the actual technology(ies) used.
      temporalRepresentativeness:
        range: DataQualityRatingEnum
        description: Degree to which the emission estimation reflects the actual time period.
      geographicalRepresentativeness:
        range: DataQualityRatingEnum
        description: Degree to which the emission estimation reflects the actual geography.
      completeness:
        range: DataQualityRatingEnum
        description: Degree to which the emission estimation is statistically representative and complete.
      reliability:
        range: DataQualityRatingEnum
        description: Reliability of the emission estimation sources and measurement or estimation methods.

  LandSectorData:
    description: Optional land sector and removals metadata.
    attributes:
      boundary:
        description: Land boundary / traceability level.
      storageDuration:
        description: Expected storage duration / permanence category.
      monitoringApproach:
        description: Monitoring approach and reversal treatment.

# ==========================================================================
# ENUMS
# ==========================================================================
enums:

  ScopeEnum:
    permissible_values:
      SCOPE_1: {description: Direct emissions from owned or controlled sources.}
      SCOPE_2: {description: Indirect emissions from purchased energy.}
      SCOPE_3: {description: All other indirect value-chain emissions.}

  EmissionCategoryEnum:
    description: >-
      Source classification. Valid values are scope-dependent; the scope-to-category
      validity constraint is enforced by rules on EmissionsLine.
    permissible_values:
      # --- Scope 1 (direct) ---
      STATIONARY_COMBUSTION: {description: "Scope 1: Stationary combustion."}
      MOBILE_COMBUSTION: {description: "Scope 1: Mobile combustion."}
      PROCESS_EMISSIONS: {description: "Scope 1: Process emissions from physical or chemical processes."}
      FUGITIVE: {description: "Scope 1: Fugitive emissions."}
      # --- Scope 2 (purchased energy) ---
      ELECTRICITY_MARKET_BASED: {description: "Scope 2: Purchased electricity (market-based method)."}
      ELECTRICITY_LOCATION_BASED: {description: "Scope 2: Purchased electricity (location-based method)."}
      HEAT_STEAM_COOLING: {description: "Scope 2: Purchased heat, steam and cooling."}
      # --- Scope 3 (value chain), GHG Protocol categories 1-15 ---
      S3_01_PURCHASED_GOODS_SERVICES: {description: "Category 1: Purchased goods and services."}
      S3_02_CAPITAL_GOODS: {description: "Category 2: Capital goods."}
      S3_03_FUEL_ENERGY_RELATED: {description: "Category 3: Fuel- and energy-related activities (not included in Scope 1 or Scope 2)."}
      S3_04_UPSTREAM_TRANSPORT: {description: "Category 4: Upstream transportation and distribution."}
      S3_05_WASTE_IN_OPERATIONS: {description: "Category 5: Waste generated in operations."}
      S3_06_BUSINESS_TRAVEL: {description: "Category 6: Business travel."}
      S3_07_EMPLOYEE_COMMUTING: {description: "Category 7: Employee commuting."}
      S3_08_UPSTREAM_LEASED_ASSETS: {description: "Category 8: Upstream leased assets."}
      S3_09_DOWNSTREAM_TRANSPORT: {description: "Category 9: Downstream transportation and distribution."}
      S3_10_PROCESSING_SOLD_PRODUCTS: {description: "Category 10: Processing of sold products."}
      S3_11_USE_OF_SOLD_PRODUCTS: {description: "Category 11: Use of sold products."}
      S3_12_EOL_SOLD_PRODUCTS: {description: "Category 12: End-of-life treatment of sold products."}
      S3_13_DOWNSTREAM_LEASED_ASSETS: {description: "Category 13: Downstream leased assets."}
      S3_14_FRANCHISES: {description: "Category 14: Franchises."}
      S3_15_INVESTMENTS: {description: "Category 15: Investments."}
      NOT_SPECIFIED: {description: "Category not specified or not disclosed by the source."}

  LineStatusEnum:
    description: Completeness of this line. Assurance status is recorded at report level.
    permissible_values:
      COMPLETE: {description: Fully measured or calculated for the reporting period.}
      INCOMPLETE: {description: Partially measured; known to under-represent the total for this line.}
      EXCLUDED: {description: Explicitly excluded from the report.}

  ReportStatusEnum:
    permissible_values:
      INCOMPLETE: {description: Not for utilisation as a full company report.}
      SELF_COMPLETED: {}
      THIRD_PARTY_COMPLETED: {}
      THIRD_PARTY_AUDITED: {}

  EmissionOriginEnum:
    permissible_values:
      FOSSIL: {}
      BIOGENIC: {}
      MIXED: {description: Origin cannot be disaggregated in the source data.}
      NOT_SPECIFIED: {description: Underlying data does not distinguish origin.}
      NOT_APPLICABLE: {description: Origin concept not relevant for this gas.}

  AccountingTypeEnum:
    permissible_values:
      EMISSION: {}
      REMOVAL: {}
      GROSS_CO2_FLUX: {description: Additional disclosure.}
      REVERSAL: {}
      OTHER_LAND_SECTOR_DISCLOSURE: {description: Reserved for future expansion.}

  GwpHorizonEnum:
    permissible_values:
      GWP20: {}
      GWP100: {}
      GWP500: {}

  IpccBasisEnum:
    permissible_values:
      AR4: {}
      AR5: {}
      AR6: {}
      NOT_SPECIFIED: {}

  GasEnum:
    permissible_values:
      CO2: {}
      CH4: {}
      N2O: {}
      HFC: {description: With subtype to be specified.}
      PFC: {}
      SF6: {}
      NF3: {}
      OTHER: {description: Specified separately.}

  DataQualityRatingEnum:
    description: GHG Protocol data quality indicator rating (Poor to Very good).
    permissible_values:
      VERY_GOOD: {}
      GOOD: {}
      FAIR: {}
      POOR: {}